<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />

    <title>莊亞筠｜數位名片</title>

    <style>
      :root {
        --bg: #fbfbfa;
        --paper: rgba(255, 255, 255, 0.78);
        --paper-border: rgba(15, 15, 15, 0.08);
        --text: rgba(15, 15, 15, 0.9);
        --muted: rgba(15, 15, 15, 0.55);
        --shadow: 0 20px 60px rgba(15, 15, 15, 0.08);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(
            900px 480px at 20% 15%,
            rgba(255, 214, 232, 0.6),
            transparent 55%
          ),
          radial-gradient(
            860px 520px at 80% 25%,
            rgba(210, 240, 255, 0.6),
            transparent 58%
          ),
          radial-gradient(
            900px 560px at 55% 95%,
            rgba(230, 255, 224, 0.55),
            transparent 60%
          ),
          var(--bg);
        transition: background 420ms ease;
      }

      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 28px 18px;
      }

      .card {
        width: min(560px, 92vw);
        background: var(--paper);
        border: 1px solid var(--paper-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 34px 26px 28px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .profile {
        display: grid;
        place-items: center;
        text-align: center;
        gap: 12px;
      }

      .avatar {
        width: 132px;
        aspect-ratio: 1 / 1;
        border-radius: 999px;
        border: 1px solid rgba(15, 15, 15, 0.14);
        background: linear-gradient(
          135deg,
          rgba(255, 214, 232, 0.9),
          rgba(210, 240, 255, 0.9),
          rgba(230, 255, 224, 0.85)
        );
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(15, 15, 15, 0.1);
      }

      .avatar-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .avatar::after {
        content: "";
        position: absolute;
        inset: -30%;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(255, 255, 255, 0.75),
          transparent 55%
        );
        transform: rotate(10deg);
      }

      .avatar-label {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.2px;
        user-select: none;
      }

      h1 {
        font-size: 28px;
        margin: 6px 0 0;
        letter-spacing: 0.2px;
      }

      .subtitle {
        margin: 0;
        font-size: 14.5px;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        border-radius: 999px;
        padding: 12px 14px;
        text-decoration: none;
        color: rgba(15, 15, 15, 0.88);
        border: 1px solid rgba(15, 15, 15, 0.12);
        background: rgba(255, 255, 255, 0.75);
        transition: transform 120ms ease, background 180ms ease,
          border-color 180ms ease;
        user-select: none;
      }

      .btn:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(15, 15, 15, 0.18);
      }

      .btn:active {
        transform: translateY(0px);
      }

      .btn svg {
        width: 18px;
        height: 18px;
        opacity: 0.8;
      }

      .hint {
        margin: 18px 0 0;
        text-align: center;
        font-size: 12px;
        color: rgba(15, 15, 15, 0.45);
        user-select: none;
      }

      .hint-inline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .gift {
        width: 16px;
        height: 16px;
        opacity: 0.8;
      }

      @media (max-width: 460px) {
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

    <script>
      const bg = document.getElementById("bg");
      const stopClickBubbling = (el) => {
        ["click", "touchstart", "pointerdown"].forEach((evt) => {
          el.addEventListener(evt, (e) => e.stopPropagation(), { passive: true });
        });
      };

      document.querySelectorAll(".btn").forEach(stopClickBubbling);

      const palettes = [
        { a: [255, 214, 232], b: [210, 240, 255], c: [230, 255, 224] },
        { a: [255, 221, 240], b: [255, 238, 214], c: [219, 232, 255] },
        { a: [255, 224, 224], b: [224, 255, 246], c: [240, 236, 255] },
        { a: [255, 232, 214], b: [219, 255, 224], c: [214, 232, 255] },
        { a: [255, 226, 246], b: [214, 255, 244], c: [255, 250, 214] },
        { a: [255, 235, 220], b: [220, 245, 255], c: [236, 255, 220] },
      ];

      let lastIdx = -1;
      const pickNewIndex = () => {
        if (palettes.length <= 1) return 0;
        let i = Math.floor(Math.random() * palettes.length);
        while (i === lastIdx) i = Math.floor(Math.random() * palettes.length);
        lastIdx = i;
        return i;
      };

      const cssBg = (p) => {
        const rgba = (rgb, a) => `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
        return [
          `radial-gradient(900px 480px at 20% 15%, ${rgba(p.a, 0.62)}, transparent 55%)`,
          `radial-gradient(860px 520px at 80% 25%, ${rgba(p.b, 0.62)}, transparent 58%)`,
          `radial-gradient(900px 560px at 55% 95%, ${rgba(p.c, 0.58)}, transparent 60%)`,
          "var(--bg)",
        ].join(", ");
      };

      const bumpBg = () => {
        const p = palettes[pickNewIndex()];
        document.body.style.background = cssBg(p);
      };

      bg.addEventListener("click", bumpBg, { passive: true });
      bg.addEventListener("touchstart", bumpBg, { passive: true });
    </script>
